name: Sales tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    name: SQLite and MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tested PHP and database images
        run: |
          docker pull nextcloud@sha256:a7fbfcd4759bdd19b8fb8b1044b47ee3a9471d2e2c8bc68d56a2e671f86cebd2
          docker tag nextcloud@sha256:a7fbfcd4759bdd19b8fb8b1044b47ee3a9471d2e2c8bc68d56a2e671f86cebd2 nextcloud:29-apache
          docker pull mariadb@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
          docker tag mariadb@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73 mariadb:10.11
      - name: Install locked test dependencies
        run: bash tools/prepare-test-deps.sh
      - name: Build frontend assets
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: SQLite suite
        run: python3 tools/test-isolated.py
      - name: MariaDB suite
        if: ${{ !cancelled() && success() }}
        run: python3 tools/test-isolated.py --database mariadb

  browser:
    name: Browser desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare PHP and test dependencies
        run: |
          docker pull nextcloud@sha256:a7fbfcd4759bdd19b8fb8b1044b47ee3a9471d2e2c8bc68d56a2e671f86cebd2
          docker tag nextcloud@sha256:a7fbfcd4759bdd19b8fb8b1044b47ee3a9471d2e2c8bc68d56a2e671f86cebd2 nextcloud:29-apache
          bash tools/prepare-test-deps.sh
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Prepare Chromium
        run: |
          npm install --prefix /tmp/sales-browser-audit playwright@1.63.0 --no-audit --no-fund
          /tmp/sales-browser-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Start synthetic app on internal network
        run: |
          python3 tools/browser/prepare.py
          bash tools/browser/start.sh
      - name: Authenticated desktop and mobile browser checks
        run: node tools/browser/authenticated.cjs
      - name: Production public login checks
        run: node tools/browser/public.cjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sales-browser-evidence
          path: |
            /tmp/sales-browser-audit/*.png
            /tmp/sales-browser-audit/*.pdf
            /tmp/sales-browser-audit/results.json
          retention-days: 7
      - name: Remove synthetic app
        if: always()
        run: |
          docker rm -f sales-browser-audit-web || true
          docker network rm sales-browser-audit-net || true
